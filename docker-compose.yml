services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 5
  frontend:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on:
      backend:
        condition: service_healthy
